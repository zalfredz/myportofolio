<div id="add-experience-modal"
     class="project-form-modal experience-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form"></button>

    <div class="project-form-modal__content experience-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Close add experience form">&times;</button>

        <h2 id="add-experience-modal-title">Add New Experience</h2>
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience' %}"
              data-ajax-url="{% url 'main:create_experience_ajax' %}"
              class="experience-editor experience-editor--modal">
            {% csrf_token %}

            <div class="experience-editor__grid experience-editor__grid--top">
                <div class="experience-editor__field">
                    <label for="{{ form.title.id_for_label }}">
                        {{ form.title.label }}
                        <span class="experience-editor__required">*</span>
                    </label>
                    {{ form.title }}
                </div>
                <div class="experience-editor__field">
                    <label for="{{ form.category.id_for_label }}">
                        {{ form.category.label }}
                        <span class="experience-editor__required">*</span>
                    </label>
                    {{ form.category }}
                </div>
            </div>

            <div class="experience-editor__field">
                <label for="{{ form.description.id_for_label }}">
                    {{ form.description.label }}
                    <span class="experience-editor__required">*</span>
                </label>
                {{ form.description }}
            </div>

            <div class="experience-editor__field">
                <label for="{{ form.thumbnail.id_for_label }}">Image / Logo URL</label>
                {{ form.thumbnail }}
            </div>

            <div class="experience-editor__grid experience-editor__grid--dates">
                <div class="experience-editor__field">
                    <label for="{{ form.start_date.id_for_label }}">
                        {{ form.start_date.label }}
                    </label>
                    {{ form.start_date }}
                </div>
                <div class="experience-editor__field">
                    <label for="{{ form.end_date.id_for_label }}">
                        {{ form.end_date.label }}
                        <span class="experience-editor__optional">Optional</span>
                    </label>
                    {{ form.end_date }}
                </div>
            </div>

            <div class="experience-editor__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Experience</button>
            </div>
        </form>
    </div>
</div>
