<form method="post"
      action="{% url 'main:toggle_experience_star' experience.id %}"
      class="experience-star-form">
    {% csrf_token %}
    <button type="submit"
            class="experience-action experience-action--star{% if user in experience.starred_by.all %} is-starred{% endif %}"
            title="{% if experience.starred_by.all %}Starred by {{ experience.starred_by.all|join:', ' }}{% else %}Be the first to star this experience{% endif %}">
        <span aria-hidden="true">&#9733;</span>
        {% if user in experience.starred_by.all %}Unstar{% else %}Star{% endif %}
        <span class="experience-star-count">{{ experience.starred_by.count }}</span>
    </button>
</form>
